# Publishes login-page/ to GitHub Pages. The page holds no secret.
name: Deploy login page

on:
  push:
    branches: [main]
    paths: [login-page/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: login-page
      - id: deployment
        uses: actions/deploy-pages@v4
